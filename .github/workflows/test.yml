name: Test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

jobs:
  run_tests:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GIT_LFS_SKIP_SMUDGE: true
      CUDA_VISIBLE_DEVICES: ""
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libavcodec-dev libavformat-dev libavutil-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Run tests
        run: |
          uv run pytest --strict-markers -q \
            src/openpi/models_pytorch/gemma_pytorch_test.py \
            src/openpi/transforms_test.py \
            packages/openpi-client/src/openpi_client/image_tools_test.py \
            packages/openpi-client/src/openpi_client/msgpack_numpy_test.py
